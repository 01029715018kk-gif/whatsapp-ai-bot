<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox AI</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user { background: #007bff; align-self: flex-end; }
        .ai { background: #2d2d2d; align-self: flex-start; border: 1px solid #444; }
        .input-area { display: flex; padding: 10px; background: #1f1f1f; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border: none; border-radius: 6px; background: #2d2d2d; color: #fff; font-size: 16px; outline: none; }
        button { background: #007bff; color: #fff; border: none; padding: 0 20px; margin-right: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        footer { text-align: center; font-size: 12px; color: #777; padding: 8px; background: #1f1f1f; }
    </style>
</head>
<body>

    <header>🦊 Fox AI</header>

    <div id="chat-box">
        <div class="message ai">أهلاً بك! أنا مساعدك الذكي Fox، كيف يمكنني مساعدتك اليوم؟</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <footer>تم الصنع بواسطة معتصم</footer>

    <script>
        const GROQ_API_KEY = 'Gsk_ij3YOmm5nrqxfjNzVFgwWGdyb3FYXtVa9WKVgXjtkXXVGix4eRVT';

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const text = inputField.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message ai">جاري الكتابة...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama3-70b-8192',
                        messages: [
                            { role: 'system', content: 'أنت مساعد ذكي وودود اسمه Fox، أجب باختصار باللغة العربية.' },
                            { role: 'user', content: text }
                        ]
                    })
                });
                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="message ai">${reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message ai">عذراً، حدث خطأ في الرد.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message ai">عذراً، تحقق من اتصالك بالإنترنت.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
